; PlatformIO Project Configuration File
; LilyGO T-Display-S3-AMOLED (ESP32-S3 + RM67162 QSPI AMOLED, 16MB flash / 8MB OPI PSRAM)
; Docs: https://wiki.lilygo.cc/products/t-display-series/t-display-s3-amoled/

[platformio]
; Board definition lives in ./boards (16MB flash, OPI PSRAM, USB CDC on boot)
boards_dir = ./boards
src_dir = src

[env:T-Display-AMOLED]
platform = espressif32
board = lilygo-t-amoled
framework = arduino

; OPI PSRAM + USB-CDC-on-boot so `Serial` maps to the native USB port
; -I. puts the project root on the include path so LVGL auto-detects our
; lv_conf.h via __has_include (-> LV_CONF_INCLUDE_SIMPLE -> #include "lv_conf.h")
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I.

lib_deps =
    lvgl/lvgl@^8.3.5
    ; Local RM67162 QSPI AMOLED driver (vendored, proven on this board)
    lib/amoled

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
